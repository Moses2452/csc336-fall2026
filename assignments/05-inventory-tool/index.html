<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Hoop Store Inventory</h1>
        <h2>Add New Product</h2>

        <form id="productForm"> 
            <label for ="nameInput">Name</label>
            <input id="nameInput" name="name" type ="text" placeholder="Product name" required>
            <label for="priceInput">Price</label>
            <input id="priceInput" name="price" type="number" min="0" step="0.01" placeholder="Price" required>
            <label for="descriptionInput">Description</label>
            <textarea id="descriptionInput" name="description" placeholder="Product description" required></textarea>
            <label for="categoryInput">Category</label>
            <select id="categoryInput" name="category" required>
                <option value="shoes">Shoes</option>
                <option value="jerseys">Jerseys</option>
            </select>
            <label for="imageInput">Image</label>
            <input id="imageInput" name="image" type="url" placeholder="Image URL" required>
            <input type="submit">

        </form>
        <p id="errorMessage"></p>
        <h2>Products</h2>
        <button id="resetButton">Reset Store</button>
        <div id="store"></div>
    </body>
</html>

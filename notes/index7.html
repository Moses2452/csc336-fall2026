<html>
    <head>
        <body>
            <div id="timeOutFunctionDiv">Set Timeout hasn't run yet</div>
            <script>
                let timeOutFunctionDiv = document.querySelector("#timeOutFunctionDiv");

                setTimeout(() => {
                    timeOutFunctionDiv.innerHTML = "the function ran";
                }, 5000);

                function fakeWait(ms) {
                    let savedCallback = null;

                    setTimeout(() => {
                        if (savedCallback) {
                            savedCallback();
                        }
                    }, ms);

                    return {
                        then: (callback) => {
                            savedCallback = callback;
                        }
                    };
                }

                let wait=fakeWait(2000);
                wait.then(()=>{
                    console.log("The wait fake promise has resolved");
                });


                //implementing a wait using real
                function wait(ms) {
                    return new Promise((resolve)=> {
                        //code that determines whether promise has been fufilled
                        setTimeout(resolve,ms);
                    });
                }
                wait(4000).then(()=>{
                    console.log("the real wait has finished waiting");
                });






            </script>
        </body>
    </head>
</html>
